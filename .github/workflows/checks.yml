name: Build and smoke tests

on:
  push:
    branches: [main, 'v*-playtest', 'v*-release']
  pull_request:
    branches: [main, 'v*-playtest', 'v*-release']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: mincmistr/print/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core=2.37-8 fonts-dejavu-extra=2.37-8
      - run: python -m pip install -r mincmistr/print/requirements.txt
      - run: npm ci
      - run: npm test
      - run: npm run verify
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run smoke
